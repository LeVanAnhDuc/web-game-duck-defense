name: CI

# Chạy trên mọi pull request. Không có nó thì một nhánh đỏ vẫn merge được, và
# thứ đầu tiên phát hiện ra sẽ là job deploy trên `main` — tức là sau khi merge.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `pnpm install --frozen-lockfile`, KHÔNG `pnpm install`: lockfile là câu
      # trả lời, còn `install` trần thì được phép ghi lại nó giữa chừng. ADR-0006
      # chốt npm; repo đã chuyển sang pnpm bằng `pnpm import` nên mọi version đã
      # giải vẫn y nguyên, và lý do gốc thì không đổi — chạy sai trình cài đặt
      # cho ra một cây phụ thuộc khác.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck

      # 231 test, không cần trình duyệt. Trong đó có cổng cân bằng FR-32: nó đỏ
      # ngay khi một con số trong `src/data/` làm một bản đồ thành bất khả thi.
      - run: pnpm test

      - run: pnpm build

      # NFR-PERF-08 — trần 900 KB gzip cho JS đầu tiên. CHẶN, không chỉ in ra:
      # Phaser chiếm phần lớn ngân sách, nên một lần thêm thư viện vô ý là đủ
      # vượt, và một dòng log thì không ai đọc trong CI xanh.
      - name: Cổng kích thước bundle (NFR-PERF-08)
        run: |
          limit=921600
          total=0
          echo "gzip của asset đã build:"
          for f in dist/assets/*.js dist/assets/*.css; do
            [ -f "$f" ] || continue
            size=$(gzip -c "$f" | wc -c)
            total=$((total + size))
            printf '  %-44s %8d B\n' "$(basename "$f")" "$size"
          done
          echo "tổng: $total B · trần: $limit B"
          if [ "$total" -gt "$limit" ]; then
            echo "::error::bundle $total B vượt trần $limit B của NFR-PERF-08"
            exit 1
          fi

  # Job RIÊNG. Playwright phải tải Chromium (~1-2 phút), và nhét nó vào `verify`
  # sẽ đẩy thời gian tới phản hồi đầu tiên lên gấp mấy lần cho mọi pull request —
  # kể cả những PR mà lint đã đủ chặn.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # 22 test trên Chromium thật. Chúng bắt loại lỗi mà `pnpm test` không thể:
      # canvas chặn pointer, snapshot không tới React, chữ tràn ở 375px.
      - run: pnpm test:e2e

      - name: Ảnh chụp và trace khi e2e đỏ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Job RIÊNG và KHÔNG cài dependency: `pnpm audit` đọc `pnpm-lock.yaml` rồi
  # hỏi registry, nó không cần `node_modules`. Đặt cạnh test thay vì trước test
  # để nó không nằm trên đường tới phản hồi đầu tiên.
  #
  # NFR-SEC-05 chỉ định CI là nơi kiểm ngưỡng này. `--audit-level=high` chỉ đỏ ở
  # high và critical: advisory mức moderate trong công cụ dev sẽ chặn mọi PR mà
  # không nói được điều gì về code.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Registry không truy cập được thì KHÔNG phải lỗi. Biến một kiểm tra bảo
      # mật thành trình chặn merge ngẫu nhiên vì sự cố của người khác là cách
      # chắc chắn nhất để nó bị vô hiệu hoá bằng `continue-on-error`. Advisory
      # thật thì vẫn đỏ; sự cố registry thì in cảnh báo và cho qua.
      #
      # `--ignore-registry-errors` là đúng cái vòng retry cũ phải làm bằng tay
      # (bắt chuỗi lỗi của npm rồi thử lại) — pnpm có sẵn cờ này, nên bỏ được
      # đoạn grep chuỗi lỗi vốn hỏng ngay khi registry đổi câu chữ.
      - name: pnpm audit (high trở lên)
        run: pnpm audit --audit-level=high --ignore-registry-errors
