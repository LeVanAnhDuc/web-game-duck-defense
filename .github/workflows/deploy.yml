name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Đẩy liên tiếp thì huỷ lần đang chạy — không có lý do gì để deploy một bản cũ
# hơn bản vừa push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Lint chay o day chu khong chi trong ci.yml: `build` bat duoc loi kieu
      # nhung khong bat vi pham lint, va mot push thang vao `main` khong di
      # qua pull request.
      - run: pnpm lint

      # Test trước khi build: `ci.yml` chỉ chạy trên pull request, nên một commit
      # đẩy thẳng vào `main` sẽ không đi qua nó.
      - run: pnpm test

      # `VITE_BASE_PATH` là biến DUY NHẤT truyền vào bản build (ADR-0010):
      # redirect_uri của Ducker ID cần một URL tuyệt đối, nên base là
      # `/<tên repo>/` chứ không còn `'./'`.
      #
      # Ducker ID sign-in đang "ship tối": cờ `VITE_FEATURE_DUCKER_SIGN_IN` và các
      # biến `VITE_DUCKER_*` CỐ Ý không được truyền ở đây, nên bản Pages không hiện
      # nút đăng nhập (ADR-0010). Bật thật = thêm chúng vào đây.
      - run: pnpm build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      # `enablement` KHÔNG thay thế việc bật Pages một lần cho repo.
      # `GITHUB_TOKEN` không tạo được Pages site — "Resource not accessible by
      # integration". Vẫn giữ vì nó không tốn gì và giúp fork của người đã bật
      # Pages sẵn. Bước một lần nằm ở README §Releases and versioning.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
